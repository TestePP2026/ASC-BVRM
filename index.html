<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASC/BVRM Basquetebol, Reguengos de Monsaraz</title>
<meta name="description" content="Jogos, resultados e equipas do Atlético Sport Clube / Bombeiros Voluntários de Reguengos de Monsaraz. Dados da Federação Portuguesa de Basquetebol.">
<meta property="og:title" content="ASC/BVRM Basquetebol"><meta property="og:image" content="assets/logo.png">
<link rel="icon" href="assets/logo.png">
<style>
:root{--g:#1b7a3d;--gd:#0c3b20;--bg:#f7f8f5;--ink:#15201a;--mut:#5b675f;--line:#dde2da;--card:#fff;--l:#a3362a}
@media(prefers-color-scheme:dark){:root{--g:#46b36f;--bg:#0f1511;--ink:#edf1ea;--mut:#9aa79d;--line:#27322a;--card:#151d17;--l:#e0705f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
header,main,footer{max-width:62rem;margin:auto;padding-left:1rem;padding-right:1rem}
header{display:flex;align-items:center;gap:.75rem;padding-top:.75rem;padding-bottom:.75rem;flex-wrap:wrap}
header img{width:44px;height:auto}
header b{display:block;line-height:1.1}header small{color:var(--mut)}
nav{margin-left:auto;display:flex;gap:1.25rem}nav a{font-weight:600;text-decoration:none}nav a:hover{text-decoration:underline}
.hero{position:relative;overflow:hidden;background:var(--gd);color:#fff;padding:1.5rem;border-radius:6px;min-height:15rem}
.hero>*{position:relative}.hero .court{position:absolute;right:-6%;bottom:-10%;width:64%;opacity:.17}
.hero h1{margin:.3rem 0 .7rem;font-size:clamp(1.9rem,6vw,3.3rem);line-height:1.05;letter-spacing:-.03em;max-width:15em}
.hero p{margin:.15rem 0}.hero small{opacity:.85}
h2{font-size:1.55rem;letter-spacing:-.02em;margin:2.75rem 0 .5rem}h3{font-size:1.05rem;margin:1.5rem 0 .25rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.75rem 0}
button{font:inherit;color:var(--ink);cursor:pointer}
.chips button{padding:.3rem .85rem;border:1px solid var(--line);background:var(--card);border-radius:99px}
.chips button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.g{display:grid;grid-template-columns:4rem 1fr auto;gap:.9rem;align-items:center;padding:.8rem 0 .8rem .9rem;border-bottom:1px solid var(--line);border-left:5px solid var(--line)}
.g.c{border-left-color:var(--g)}
.d{text-align:center;line-height:1.1}.d b{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums}.d span{font-size:.8rem;color:var(--mut)}
.m small{display:block;color:var(--mut)}.m .t{font-weight:600}.us{color:var(--g);font-weight:800}
.r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.r small{display:block;font-weight:400;color:var(--mut)}.r.v{color:var(--g)}.r.l{color:var(--l)}
.more{margin-top:.75rem;padding:.4rem .9rem;border:1px solid var(--line);background:var(--card);border-radius:6px}
.mut{color:var(--mut)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.75rem;margin-top:1rem}
.tm{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.75rem 1rem}
.tm summary{cursor:pointer;list-style:none}.tm summary b{display:block;font-size:1.1rem}.tm summary small{color:var(--mut)}
.tm img{width:100%;border-radius:4px;margin-top:.5rem}.tm ul{list-style:none;padding:0;margin:.5rem 0}
.tm li{display:flex;gap:.75rem;padding:.2rem 0;border-top:1px solid var(--line)}.tm li span{width:2rem;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.25rem;margin:1rem 0}dt{color:var(--mut)}dd{margin:0}
#links{display:flex;gap:1.25rem;flex-wrap:wrap}
footer{color:var(--mut);font-size:.9rem;padding-top:2rem;padding-bottom:2rem}
@media(max-width:30rem){.g{grid-template-columns:3.2rem 1fr auto;gap:.6rem}}
.hero h1{font-size:clamp(1.7rem,5vw,2.6rem);max-width:none;margin-bottom:.4rem}
.hg{margin-top:.9rem;max-width:42rem}
.hr{display:grid;grid-template-columns:4.5rem 1fr;gap:.75rem;padding:.6rem 0;border-top:1px solid rgba(255,255,255,.25)}
.hr b{font-size:1.4rem;font-variant-numeric:tabular-nums}.hr small{display:block;opacity:.8}.hr .ht{font-weight:650}
a.tm{display:block;text-decoration:none;color:inherit}a.tm:hover{border-color:var(--g)}
a.tm b{display:block;font-size:1.1rem}a.tm small{display:block;color:var(--mut)}.tn{display:block;margin-top:.35rem;font-size:.9rem}
.back{display:inline-block;margin-top:1rem;font-weight:600}.th{margin:.4rem 0 0}
.tp{width:100%;max-width:40rem;border-radius:6px;margin-top:.75rem}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.6rem;margin-top:.75rem}
.pl{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.55rem .75rem;display:grid;grid-template-columns:2.8rem 1fr;align-items:center}
.pl b{grid-row:span 2;font-size:1.6rem;color:var(--g);font-variant-numeric:tabular-nums}.pl small{color:var(--mut)}
.lk{display:flex;gap:1.25rem;flex-wrap:wrap;margin-top:1.5rem}
</style>
</head>
<body>
<header>
<img src="assets/logo.png" alt="Emblema do ASC/BVRM" width="44" height="48">
<div><b>ASC/BVRM</b><small>Basquetebol, Reguengos de Monsaraz</small></div>
<nav aria-label="Principal"><a href="#jogos">Jogos</a><a href="#equipas">Equipas</a><a href="#clube">Clube</a></nav>
</header>
<main>
<div id="home">
<section class="hero" id="hero" aria-live="polite">
<svg class="court" viewBox="0 0 400 260" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="140" y="0" width="120" height="150"/><circle cx="200" cy="150" r="60"/><path d="M40 0v90a160 160 0 0 0 320 0V0"/><circle cx="200" cy="28" r="9"/><path d="M175 14h50"/></svg>
</section>
<noscript><p>Para ver os jogos é preciso ativar o JavaScript. Também estão em <a href="https://www.fpb.pt/calendario/clube_43">fpb.pt</a>.</p></noscript>
<section id="jogos"><h2>Jogos</h2>
<div class="chips" id="chips" role="group" aria-label="Filtrar por escalão"></div>
<h3>Próximos jogos</h3><div id="up"></div>
<h3>Resultados</h3><div id="res"></div>
</section>
<section id="equipas"><h2>Equipas</h2><div class="teams" id="teams"></div></section>
<section id="clube"><h2>O clube</h2><dl id="club"></dl><div id="links"></div></section>
</div>
<section id="team" hidden></section>
</main>
<footer><span id="upd"></span></footer>
<script>
const q=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const get=u=>fetch(u,{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null);
const MO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],WD=["dom","seg","ter","qua","qui","sex","sáb"];
const label=(c="")=>{let m=c.match(/sub-?\s?(\d+)/i),k=m?(+m[1]<=12?"Mini "+m[1]:"Sub-"+m[1]):/divis|s[eé]nior/i.test(c)?"Sénior":(m=c.match(/mini\s?-?\s?(\d+)/i))?"Mini "+m[1]:"Outros";return k+(/\bfem/i.test(c)?" F":/\bmas|\bm\b/i.test(c)?" M":"")};
function merge(a=[],man=[]){const m=new Map(a.map(g=>[String(g.id),g])),extra=[];
 for(const x of man){const k=x.id!=null&&x.id!==""?String(x.id):null;
  if(x.hidden){k&&m.delete(k);continue}
  if(k&&m.has(k)){const o=m.get(k);for(const f in x)if(f!=="hidden"&&x[f]!==""&&x[f]!=null)o[f]=x[f]}else extra.push(x)}
 return[...m.values(),...extra]}
(async()=>{
const [club,auto,man,teams,ros]=await Promise.all(["club","games","games-manual","teams","rosters"].map(n=>get(`data/${n}.json`)));
const re=new RegExp(club?.match||"ASC/BVRM","i"),us=n=>re.test(n||"");
const all=merge(auto?.games,man?.games).map(g=>({...g,cat:label(g.comp)})).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
const played=g=>g.hs!=null&&g.hs!=="",today=new Date().toLocaleDateString("sv-SE");
const up=all.filter(g=>!played(g)&&g.date>=today),res=all.filter(played).reverse();
const hero=q("#hero"),n=up[0];
if(n){const day=up.filter(g=>g.date===n.date),dt=new Date(n.date+"T12:00"),dd=Math.round((dt-new Date(today+"T12:00"))/864e5);
 hero.append(el("p",0,day.length>1?"Próximos jogos":"Próximo jogo"),
  el("h1",0,(dd===0?"Hoje, ":dd===1?"Amanhã, ":"")+dt.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"})));
 const box=el("div","hg");
 day.forEach(g=>{const r=el("div","hr"),d=el("div");d.append(el("small",0,g.cat),el("div","ht",`${g.home} vs ${g.away}`),el("small",0,[g.venue,g.city].filter(Boolean).join(", ")));r.append(el("b",0,g.time||"A definir"),d);box.append(r)});
 hero.append(box)}
else hero.append(el("h1",0,"Sem jogos marcados"),el("p",0,"Os próximos jogos aparecem aqui assim que a FPB os publicar."));
const nm=s=>el("span",us(s)?"us":"",s);
const row=g=>{const d=new Date(g.date+"T12:00"),r=el("div","g"+(us(g.home)?" c":"")),dd=el("div","d"),m=el("div","m"),t=el("div","t"),s=el("div","r");
 dd.append(el("b",0,d.getDate()),el("span",0,MO[d.getMonth()]+" "+WD[d.getDay()]));
 t.append(nm(g.home)," vs ",nm(g.away));
 m.append(el("small",0,g.cat+(us(g.home)?", em casa":", fora")),t,el("small",0,[g.venue,g.city].filter(Boolean).join(", ")));
 if(played(g)){const x=us(g.home)?[g.hs,g.as]:[g.as,g.hs],w=x[0]>x[1]?"v":x[0]<x[1]?"l":"";
  s.className="r "+w;s.append(`${g.hs}–${g.as}`,el("small",0,w==="v"?"Vitória":w==="l"?"Derrota":"Empate"))}
 else s.textContent=g.time||"Hora por definir";
 r.append(dd,m,s);return r};
let f="";const open={},cats=[...new Set(all.map(g=>g.cat))].sort();
const list=(box,arr,empty,k)=>{const a=arr.filter(g=>!f||g.cat===f);box.replaceChildren();
 if(!a.length)box.append(el("p","mut",empty));
 a.slice(0,open[k]?a.length:8).forEach(g=>box.append(row(g)));
 if(a.length>8&&!open[k]){const b=el("button","more",`Ver os restantes ${a.length-8}`);b.type="button";b.onclick=()=>{open[k]=1;draw()};box.append(b)}};
const draw=()=>{q("#chips").replaceChildren(...["",...cats].map(c=>{const b=el("button",0,c||"Todos");b.type="button";b.setAttribute("aria-pressed",String(c===f));b.onclick=()=>{f=c;draw()};return b}));
 list(q("#up"),up,"Sem jogos marcados neste escalão.","up");list(q("#res"),res,"Ainda sem resultados neste escalão.","res")};
draw();
const TITLE=document.title,TT=teams?.teams||[];
const lab=t=>label(`${t.category||""} ${t.gender||""}`),same=(g,t)=>{const a=lab(t);return a===g.cat||a.startsWith(g.cat+" ")};
const tid=t=>"equipa-"+(t.fpb_id||t.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-"));
const plist=t=>[...(t.hide_players?[]:(t.players?.length?t.players:(ros?.teams?.[t.fpb_id]||[])))].sort((a,b)=>(a.number??999)-(b.number??999));
const short=g=>{const d=new Date(g.date+"T12:00");return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`+(g.time?`, ${g.time}`:"")};
const tl=q("#teams");
TT.forEach(t=>{const a=el("a","tm"),nx=up.find(g=>same(g,t)),np=plist(t).length;a.href="#"+tid(t);
 a.append(el("b",0,t.name),el("small",0,t.competition||[t.category,t.gender].filter(Boolean).join(" ")),el("span","tn",nx?"Próximo jogo: "+short(nx):"Sem jogos marcados"));
 if(np)a.append(el("span","tn",np+" jogadores"));tl.append(a)});
const view=q("#team"),home=q("#home");
const show=()=>{const m=location.hash.match(/^#(equipa-[\w-]+)$/),t=m&&TT.find(x=>tid(x)===m[1]);
 if(!t){home.hidden=false;view.hidden=true;document.title=TITLE;if(location.hash)document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();return}
 home.hidden=true;view.hidden=false;view.replaceChildren();document.title=t.name+" | ASC/BVRM Basquetebol";
 const nx=up.filter(g=>same(g,t)),rs=res.filter(g=>same(g,t)),p=plist(t),back=el("a","back","Voltar às equipas");back.href="#equipas";
 const sec=(h,arr,none)=>{view.append(el("h3",0,h));const d=el("div");arr.forEach(g=>d.append(row(g)));if(!arr.length)d.append(el("p","mut",none));view.append(d)};
 view.append(back,el("h2","th",t.name),el("p","mut",t.competition||""));
 if(t.coach)view.append(el("p",0,"Equipa técnica: "+t.coach));
 if(t.photo){const i=el("img","tp");i.src=t.photo;i.alt="Equipa "+t.name;view.append(i)}
 sec("Próximos jogos",nx,"Sem jogos marcados.");sec("Resultados",rs,"Ainda sem resultados.");
 view.append(el("h3",0,"Plantel"));
 if(p.length){const gr=el("div","roster");p.forEach(x=>{const c=el("div","pl");c.append(el("b",0,x.number??"–"),el("span",0,x.name));if(x.position)c.append(el("small",0,x.position));gr.append(c)});view.append(gr)}
 else view.append(el("p","mut",t.hide_players?"Plantel não publicado.":"Plantel por publicar."));
 const ln=el("p","lk");
 if(t.fpb_id){const a=el("a",0,"Página da equipa na FPB");a.href="https://www.fpb.pt/equipa/equipa_"+t.fpb_id;a.rel="noopener";ln.append(a)}
 if(t.fpb_url){const a=el("a",0,"Classificação na FPB");a.href=t.fpb_url;a.rel="noopener";ln.append(a)}
 view.append(ln);scrollTo(0,0)};
if(club){[["Pavilhão",club.venue],["Morada",club.address],["Email",club.email],["Telefone",club.phone],["Fundado em",club.founded]].filter(x=>x[1]).forEach(([k,v])=>q("#club").append(el("dt",0,k),el("dd",0,v)));
 (club.links||[]).forEach(x=>{const a=el("a",0,x.label);a.href=x.url;a.rel="noopener";q("#links").append(a)})}
q("#upd").textContent="Jogos e resultados da Federação Portuguesa de Basquetebol"+(auto?.updated?", atualizados em "+new Date(auto.updated).toLocaleString("pt-PT",{dateStyle:"long",timeStyle:"short"}):"")+".";
show();addEventListener("hashchange",show);
})();
</script>
</body>
</html>
